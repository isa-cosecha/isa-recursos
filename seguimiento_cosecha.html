<title>Seguimiento de Cosecha — módulo independiente</title>
<!--
  Módulo de seguimiento (SGP), independiente del Planificador de Cosecha.
  Solo LEE la base del planificador (Firestore, colección compartida) o su JSON exportado. No escribe nada en la base.
  Los cortes de seguimiento se guardan en este navegador (localStorage) y se pueden exportar/importar como archivo.
  Todo el JS vive en el objeto SGP y el CSS bajo .sgp: listo para montarse más adelante como una página del planificador
  (la lectura ya produce el mismo objeto DB que usa el planificador: planItems, campos, realRecords).
-->

<style>

.sgp{
  --navy:#0D4934; --orange:#BA7517; --green:#1D9E75; --cyan:#378ADD; --red:#A32D2D;

.sgp button:hover{filter:brightness(1.08)} .sgp button:active{filter:brightness(.95)}
.sgp button:focus-visible,.sgp input:focus-visible,.sgp select:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.sgp .btn-primary{background:var(--accent);color:#fff}

.sgp .row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}

.sgp .status{margin-top:6px;font-size:11.5px;color:var(--muted)} .sgp .status.ok{color:var(--green);font-weight:600} .sgp .status.err{color:var(--red);font-weight:600}

.sgp .vista-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.sgp .fcard{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 22px}
.sgp .fhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:12px}

.sgp .fhead .fcap{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px}

.sgp .fplantio-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.sgp .fcard-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.sgp .flist{font-size:12.5px}
.sgp .frow{display:grid;grid-template-columns:105px 1fr;gap:6px;padding:2px 0} .sgp .frow .k{color:var(--muted)} .sgp .frow .v{font-weight:600}
.sgp .fmetrics-head{display:grid;grid-template-columns:90px 70px 70px;gap:4px;margin:8px 0 3px} .sgp .fmetrics-head .tag{text-align:center;padding:2px 0}
.sgp .fmetric-row{display:grid;grid-template-columns:90px 70px 70px;gap:4px;font-size:12px;padding:2px 0} .sgp .fmetric-row .fv{text-align:center;font-weight:700}
.sgp .fkpi-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}

.sgp .pct-card .top{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600} .sgp .pct-card .top i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.sgp .pct-card .pct{font-size:19px;font-weight:800;margin-top:2px} .sgp .pct-card .sub{font-size:10.5px;color:var(--muted)}
.sgp .fsection-title{font-weight:800;font-size:12px;background:#d9dcdf;text-align:center;padding:5px 0;border-radius:5px;margin:16px 0 8px}
.sgp .ftotals{display:flex;flex-wrap:wrap;gap:18px;font-size:12px;margin:10px 0 2px} .sgp .ftotals b{font-size:13px}
.sgp .no-data{color:var(--muted);font-size:13px;padding:18px 0;text-align:center}
.sgp .note{font-size:12px;color:var(--muted);line-height:1.5}
.sgp .diag{display:flex;gap:10px;padding:9px 12px;border-radius:8px;margin-bottom:8px;font-size:13px;line-height:1.45}
.sgp .diag.warn{background:#FAEEDA;border:1px solid #FAC775} .sgp .diag.info{background:var(--panel);border:1px solid var(--line)}
.sgp .diag b{flex:none}
.sgp .gantt{width:100%;height:auto;display:block}
.sgp .chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:12px;padding:3px 10px;background:var(--panel);border:1px solid var(--line);margin-right:6px}
@media (max-width:1000px){.sgp .fcard-grid{grid-template-columns:minmax(0,1fr)}}

.sgp .tabs button.on{color:var(--navy)}
.sgp .st{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px}
.sgp .st.c{background:#EAF3DE;color:#3B6D11}.sgp .st.e{background:#E6F1FB;color:#185FA5}.sgp .st.p{background:#F1EFE8;color:#555555}
.sgp .bar{height:6px;background:#F1EFE8;border-radius:3px;min-width:60px;overflow:hidden}.sgp .bar i{display:block;height:100%;background:var(--green)}
.sgp input[type=checkbox]{width:auto;margin:0;vertical-align:middle}
.sgp select,.sgp input[type=number]{margin:0;width:auto}

.sgp .fcard-grid>.fkpi-wrap{max-width:520px}
@media (max-width:1750px){.sgp .fcard-grid>.fkpi-wrap{flex-direction:row;flex-wrap:wrap;justify-content:flex-start}.sgp .fcard-grid>.fkpi-wrap svg{max-width:190px}.sgp .fcard-grid>.fkpi-wrap .pct-grid{width:auto;grid-template-columns:repeat(4,150px)}}

.sgp table.pf th.nd{color:#9aa3ad;font-style:italic;background:#f1f2f4}

.sgp table.pf td.nm{max-width:240px}

</style>

<body style="margin:0;background:#edf0f4">
<header class="sgp-top"><a href="index.html" class="sgp-btn" title="Volver a la portada"><i class="ti ti-home"></i> Inicio</a><span class="sgp-title">Seguimiento de Cosecha</span><span id="sgp-sync" class="sgp-sync" aria-live="polite"></span><button type="button" class="sgp-btn" onclick="SGP.api.recargar()" title="Vuelve a leer la base del planificador"><i class="ti ti-refresh"></i> Actualizar</button></header>
<div id="sgp-root" class="sgp"></div>
<script>
var SGP=(function(){
'use strict';
var MS=86400000, DOW=['dom','lun','mar','mié','jue','vie','sáb'];
function p2(n){return String(n).padStart(2,'0');}
function dOf(s){return new Date((Math.floor(s)-25569)*MS);}
function fD(s){if(s==null||!isFinite(s))return '—';var d=dOf(s);return p2(d.getUTCDate())+'/'+p2(d.getUTCMonth()+1);}
function fDW(s){if(s==null||!isFinite(s))return '—';return DOW[dOf(s).getUTCDay()]+' '+fD(s);}
function fDY(s){if(s==null||!isFinite(s))return '—';return fD(s)+'/'+dOf(s).getUTCFullYear();}
function fHM(s){var m=Math.round((s-Math.floor(s))*1440);return p2(Math.floor(m/60)%24)+':'+p2(m%60);}
function fN(v,d){if(v==null||!isFinite(v))return '—';d=d||0;return v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fS(v,d){if(v==null||!isFinite(v))return '—';return (v>0?'+':'')+fN(v,d||0);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function frKey(f){var m=/^K(\d+)(.*)$/.exec(f);return m?[+m[1],m[2]]:[999,String(f)];}
function frSort(a,b){var x=frKey(a),y=frKey(b);return x[0]-y[0]||(x[1]<y[1]?-1:x[1]>y[1]?1:String(a).localeCompare(String(b)));}
var BANDAS={adel:{n:'Adelantado',c:'var(--cyan)'},vent:{n:'En ventana',c:'var(--green)'},leve:{n:'Atraso leve',c:'var(--orange)'},crit:{n:'Atraso crítico',c:'var(--red)'},nd:{n:'Sin dato',c:'#aab2bd'}};
var ORDEN_B=['adel','vent','leve','crit'];
function banda(desv,tol){if(desv==null)return 'nd';if(desv<-tol)return 'adel';if(desv<=tol)return 'vent';if(desv<=2*tol)return 'leve';return 'crit';}

/* ═══════════ FUENTE DE DATOS: base del planificador (SOLO LECTURA) ═══════════
   Dos vías, ambas producen el mismo objeto DB = {planItems, campos, realRecords, usarRealEnPlan, zafraPorDefecto, frentes}:
   (1) Firestore, colección compartida del planificador, con el login del propio usuario (solo .get(), nunca escribe).
   (2) El JSON que descarga el botón "Exportar JSON" del planificador.
   Este módulo NO modifica nada del planificador ni de su base. */
var COL='planificador_compartido';
var FB_CONFIG={
  apiKey: "AIzaSyD489aJJ6xGniyinLzm3AJZn3C3qz0RNzA",
  authDomain: "planificador-de-cosecha.firebaseapp.com",
  projectId: "planificador-de-cosecha",
  storageBucket: "planificador-de-cosecha.firebasestorage.app",
  messagingSenderId: "136366145229",
  appId: "1:136366145229:web:af3067a259216b6bc7b384",
  measurementId: "G-0DSZBP5KVQ"
};
var DB=null, fbDb=null, fbAuth=null;
/* ── Caché local (IndexedDB): muestra al instante la última lectura y actualiza en segundo plano ── */
var CACHE_DB='sgp-cache',CACHE_ST='base',CACHE_KEY='ultima',_leyendo=false;
function cacheAbrir(){return new Promise(function(res,rej){try{var q=indexedDB.open(CACHE_DB,1);q.onupgradeneeded=function(){q.result.createObjectStore(CACHE_ST);};q.onsuccess=function(){res(q.result);};q.onerror=function(){rej(q.error);};}catch(e){rej(e);}});}
function cacheLeer(){return cacheAbrir().then(function(db){return new Promise(function(res){var r=db.transaction(CACHE_ST).objectStore(CACHE_ST).get(CACHE_KEY);r.onsuccess=function(){res(r.result||null);};r.onerror=function(){res(null);};});}).catch(function(){return null;});}
function cacheGuardar(d){return cacheAbrir().then(function(db){return new Promise(function(res){var tx=db.transaction(CACHE_ST,'readwrite');tx.objectStore(CACHE_ST).put({ts:Date.now(),d:d},CACHE_KEY);tx.oncomplete=function(){res(true);};tx.onerror=tx.onabort=function(){res(false);};});}).catch(function(){return false;});}
function cacheBorrar(){return cacheAbrir().then(function(db){return new Promise(function(res){var tx=db.transaction(CACHE_ST,'readwrite');tx.objectStore(CACHE_ST).delete(CACHE_KEY);tx.oncomplete=tx.onerror=tx.onabort=function(){res(true);};});}).catch(function(){return false;});}
function fechaCorta(ts){return new Date(ts).toLocaleString('es',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function setSync(txt,kind){var e=document.getElementById('sgp-sync');if(!e)return;e.textContent=txt||'';e.className='sgp-sync'+(kind?' '+kind:'');e.title=txt||'';}
function restaura(v){
  if(v===null||typeof v!=='object')return v;
  if(Array.isArray(v))return v.map(restaura);
  if(v.__na===true&&typeof v.v==='string'){try{return JSON.parse(v.v);}catch(e){return [];}}
  var o={};Object.keys(v).forEach(function(k){o[k]=restaura(v[k]);});return o;
}
function labKey(n){return String(n==null?'':n).trim().replace(/^0+/,'');}
function labSep(d){ /* quema y madurador: del JSON (planQuema/planMadurador) o de la categoría 'labores' de Firestore (laboresPlan con tipo Q/M) */
  var lp=Array.isArray(d.laboresPlan)?d.laboresPlan:[],q=Array.isArray(d.planQuema)?d.planQuema:lp.filter(function(r){return r.tipo==='Q';}),m=Array.isArray(d.planMadurador)?d.planMadurador:lp.filter(function(r){return r.tipo==='M';});
  var Q={},M={};
  q.forEach(function(r){var k=r.zafra+'|'+labKey(r.codigo),o=Q[k]||(Q[k]={ha:0,n:0,f:null});o.ha+=+r.area||0;o.n++;if(r.fecha&&(!o.f||r.fecha<o.f))o.f=r.fecha;});
  m.forEach(function(r){var k=r.zafra+'|'+labKey(r.codigo),o=M[k]||(M[k]={ha:0,f:null,dias:null,obj:null});o.ha+=+r.haTotal||0;if(r.fecha&&(!o.f||r.fecha>=o.f)){o.f=r.fecha;o.dias=r.diasCorte;o.obj=(r.diasCorte!=null)?new Date(Date.parse(r.fecha+'T00:00:00Z')+r.diasCorte*864e5).toISOString().slice(0,10):null;}});
  return {Q:Q,M:M,hayQ:q.length>0,hayM:m.length>0,nQ:q.length,nM:m.length,mRows:m,meta:(d.laboresMeta&&typeof d.laboresMeta==='object')?d.laboresMeta:{},zQ:q.reduce(function(a,r){a[r.zafra]=1;return a;},{})};
}
function laborTag(p){ /* quema/madurador del lote en su zafra: 🔥 en plan de quema, 🌿 fuera (si la zafra tiene plan), 🧪 madurador */
  if(!DB||!DB.labores||!p)return '';var k=p.zafra+'|'+labKey(p.campoNombre),L=DB.labores,t='';
  {var q=L.Q[k];t+=q?'<span title="Plan de quema: '+q.f+(q.n>1?' ('+q.n+' bloques)':'')+'" style="margin-left:4px">🔥'+q.f.slice(5)+'</span>':'<span title="Fuera del plan de quema (o sin plan cargado): corte en verde" style="margin-left:4px">🌿</span>';}
  return t;
}
function normalizarDB(d,fuente){
  var o=function(x){return (x&&typeof x==='object'&&!Array.isArray(x))?x:{};};
  return {labores:labSep(d),planItems:Array.isArray(d.planItems)?d.planItems:[],campos:Array.isArray(d.campos)?d.campos:[],realRecords:Array.isArray(d.realRecords)?d.realRecords:[],
    usarRealEnPlan:d.usarRealEnPlan,zafraPorDefecto:d.zafraPorDefecto||'',frentes:Array.isArray(d.frentes)?d.frentes:[],
    mantenimientos:Array.isArray(d.mantenimientos)?d.mantenimientos:[],
    horasMetaDiaria:o(d.horasMetaDiaria),horasMetaDiariaOrigen:o(d.horasMetaDiariaOrigen),horasMetaSemanal:o(d.horasMetaSemanal),horasMetaSemanalOrigen:o(d.horasMetaSemanalOrigen),
    maquinasMetaDiaria:o(d.maquinasMetaDiaria),maquinasMetaDiariaOrigen:o(d.maquinasMetaDiariaOrigen),maquinasMetaSemanal:o(d.maquinasMetaSemanal),maquinasMetaSemanalOrigen:o(d.maquinasMetaSemanalOrigen),
    frenteMaquinasPorZafra:o(d.frenteMaquinasPorZafra),fuente:fuente,cargadoEl:new Date()};
}
async function leerCategoria(cat,campoArray){

  if(g){

    else if(!g.nRealAplicado)d.push({n:'warn',t:'Hay '+g.nReal+' registros reales en la zafra, pero ninguno se asignó a un lote. Revisa que el frente de Ejecución coincida con el del plan.'});
    if(g.desconocidos)d.push({n:'warn',t:g.desconocidos+' registro(s) real(es) nombran un lote que no existe en ese frente; se tratan como producción del frente y se asignan en orden de secuencia.'});
    if(g.realOff)d.push({n:'info',t:'En el planificador "Usar lo real en el plan" está apagado: su simulación ignora lo real, este módulo no.'});
    d.push({n:'info',t:'Configuración del plan leída de la base para la zafra '+s.zafra+': '+g.ovDiaHoras+' días con horas ajustadas a mano/optimizador, '+g.ovDiaMaq+' días con máquinas ajustadas, '+g.nMtto+' mantenimientos programados'+(g.ovSug?'; '+g.ovSug+' ajuste(s) «sugerido(s)» sin confirmar se ignoran, igual que en el planificador':'')+'.'});
    if(g.ovDiaHoras+g.ovDiaMaq===0&&g.nMtto===0)d.push({n:'info',t:'No hay horas, máquinas ni mantenimientos ajustados por día en la base: la proyección usa solo las horas y máquinas con que se creó cada lote. Si ya aplicaron una optimización, revisa que se haya guardado.'});
    g.difPlan.forEach(function(x){d.push({n:'info',t:'Frente '+x.fn+': el plan guardado termina el '+fDY(x.plan)+' y la proyección día por día sin lo real da '+fDY(x.motor)+'. Se usa el plan guardado como base (incluye traslados, salida escalonada de máquinas y el equilibrio de cierre, que este módulo no replica). Si el plan se modificó sin «Ajustar secuencia», esas fechas pueden estar desactualizadas.'});});
    if(g.deManual.length)d.push({n:'warn',t:g.deManual.length+' lote(s) pasaron de un frente manual a uno mecanizado ('+g.deManual.slice(0,4).join('; ')+(g.deManual.length>4?'…':'')+'): su productividad por cosechadora no se puede recalcular desde la base y se estima con el promedio del resto de lotes de ese frente.'});

    if(g.dup.length)d.push({n:'warn',t:'Nombres de lote repetidos dentro del mismo frente: '+g.dup.join('; ')+'. El reparto de lo real los identifica por nombre.'});
    if(g.sinFecha.length)d.push({n:'warn',t:g.sinFecha.length+' lote(s) sin fecha de inicio programada: no tienen desviación.'});
  }

  if(largos.length)d.push({n:'warn',t:largos.length+' lote(s) con más de 45 días entre su primer registro/llegada y su fin: '+largos.slice(0,5).join('; ')+(largos.length>5?'…':'')+'. Suele ser un registro de Ejecución con fecha o lote equivocado; estiran el mapa cuando no hay filtro de fechas.'});

  d.push({n:'info',t:'Fuente: '+DB.fuente+', leída el '+DB.cargadoEl.toLocaleString('es')+'. Corte proyectado del '+fDY(s.fechaBase)+(g&&g.nReal?' (día siguiente al último registro real).':' (inicio del plan, no hay real).')});
  return d;

   Media ponderada (por Ha aplicadas) de «Días Madurador a Corte (Plan)», por producto y tenencia, de la zafra elegida.
   El corte debe llegar al lote con (días desde la aplicación) = media ± tolerancia. Se puede fijar los días y la tolerancia a mano. */
function vmTen(t){return /prov/i.test(t||'')?'Proveedor':'Propio';}

  S._vmI={db:DB,z:z,m:m};return m;
}

  DB.campos.forEach(function(c){var k=labKey(c.nombre);if(!ten[k])ten[k]=vmTen(c.tenencia);});
  DB.labores.mRows.forEach(function(r){
    if(r.zafra!==z||r.diasCorte==null)return;var t=ten[labKey(r.codigo)];if(!t)return;
    var p=r.producto||'(sin producto)',k=p+'|'+t,o=g[k]||(g[k]={producto:p,tenencia:t,ha:0,hd:0,lotes:{}}),h=+r.haTotal||0;

  var rd=new FileReader();
  rd.onload=function(){try{var j=JSON.parse(rd.result);if(!j||j.tipo!=='sgp-cortes'||!Array.isArray(j.cortes))throw new Error('No es un archivo de cortes de este módulo.');
      var n=0;j.cortes.forEach(function(c){if(!c||!c.id||!c.zafra||!Array.isArray(c.frentes))return;S.cortes=S.cortes.filter(function(x){return x.id!==c.id;});S.cortes.push(c);n++;});
      guardarLocal();S.msgOk=true;S.msg=n+' corte(s) importado(s).';}catch(e){S.msgOk=false;S.msg='No se pudo importar: '+e.message;}render();};
  rd.readAsText(file);
}
function bind(){
  root.addEventListener('click',function(e){
    var t=e.target.closest('[data-tab],[data-sel],[data-act]');if(!t)return;
    if(t.dataset.tab)S.tab=t.dataset.tab;
    else if(t.dataset.sel)S.sel[t.dataset.f]=+t.dataset.sel;
    else{var a=t.dataset.act;
      if(a==='nota'){S.notaOpen=!S.notaOpen;}
      else if(a==='tFuente'){S.verFuente=!S.verFuente;}
      else if(a==='tFiltros'){S.verFiltros=!S.verFiltros;}
      else if(a==='save')guardarCorte();
      else if(a==='del'){var c=cortesZafra().filter(function(x){return x.id===S.cur;})[0];if(c&&confirm('¿Eliminar el corte "'+c.etiqueta+'"?')){S.cortes.splice(S.cortes.indexOf(c),1);S.cur='live';guardarLocal();S.msgOk=true;S.msg='Corte eliminado.';}}
      else if(a==='login'){login();return;}
      else if(a==='leer'){leerDesdeFirestore();return;}
      else if(a==='salir'){DB=null;S.user=null;cacheBorrar();setSync('');fbAuth.signOut();S.srcMsg='Sesión cerrada.';S.srcOk=true;}
      else if(a==='export'){exportarCortes();return;}
      else if(a==='import'){document.getElementById('sgp-imp').click();return;}
    }
    render();
  });
  root.addEventListener('change',function(e){
    var t=e.target,id=t.id;
    if(id==='sgp-json'){if(t.files[0])leerJSON(t.files[0]);return;}
    if(id==='sgp-imp'){if(t.files[0])importarCortes(t.files[0]);return;}
    if(id==='sgp-zafra'){S.zafra=t.value;S.cur='live';S.base='';S.sel={};}
    else if(id==='sgp-cur'){S.cur=t.value;if(S.base===S.cur)S.base='';}
    else if(id==='sgp-base'){S.base=t.value;if(t.value&&S.tab!=='seguimiento')S.tab='seguimiento';}
    else if(id==='sgp-tol'){S.tol=Math.max(0,Math.min(15,parseInt(t.value,10)||0));}
    else if(id==='sgp-pf-frente'){S.pfFrente=t.value;}
    else if(t.dataset.pfe){S.pfEst[t.dataset.pfe]=t.checked;}
    else if(id==='sgp-fmode'){S.fMode=t.value;var b0=curSnap().fechaBase,z0=inicioZafra();
      if(t.value==='dia'&&!S.fDia)S.fDia=isoOf(b0);
      if(t.value==='rango'){if(!S.fDesde)S.fDesde=isoOf(b0);if(!S.fHasta)S.fHasta=isoOf(b0+6);}
      if(t.value==='semana'&&z0!=null)S.fSemana=semanaDe(b0,z0);}
    else if(id==='sgp-fdia'){S.fDia=t.value;}
    else if(id==='sgp-fdesde'){S.fDesde=t.value;}
    else if(id==='sgp-fhasta'){S.fHasta=t.value;}
    else if(id==='sgp-fsem'){S.fSemana=parseInt(t.value,10)||1;}
    else if(t.dataset.fr){S.frSel[t.dataset.fr]=t.checked;}
    else return;
    S.msg=null;render();
  });
  root.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.target.id==='sgp-pass'||e.target.id==='sgp-email'))login();});
}
function mount(el){root=el;cargarLocal();bind();iniciarFirebase();render();
  cacheLeer().then(function(c){
    if(!c||!c.d||DB)return;
    try{DB=normalizarDB(c.d,'Caché local');DB.cargadoEl=new Date(c.ts);DB.desdeCache=true;S.zafra='';S.srcMsg='Mostrando datos guardados del '+fechaCorta(c.ts)+'.';S.srcOk=true;
      setSync('Datos guardados del '+fechaCorta(c.ts)+(_leyendo||S.authPend?' · actualizando…':''),_leyendo||S.authPend?'ld':'');render();}
    catch(e){DB=null;}
  });}
return {mount:mount,api:{recargar:function(){if(fbDb&&S.user)leerDesdeFirestore();else render();},puLote:puLote,nMaqAlCrear:nMaqAlCrear,fromBase:fromBase,project:project,compare:compare,diagnose:diagnose,state:S,render:render,setDB:function(d){DB=normalizarDB(d,'API');S.zafra='';render();}}};
})();
SGP.mount(document.getElementById('sgp-root'));

</script>
</body>
